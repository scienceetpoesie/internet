<script>
(function(){
    function init(){
        var pc=document.getElementById('page-container');
        if(!pc)return;
        document.addEventListener('click',function(e){
            var el=e.target;
            while(el&&el!==document.body){
                if(el.tagName==='A'){
                    var p=el.parentElement;
                    while(p&&p!==document.body){if(p.id==='outline')break;p=p.parentElement;}
                    if(p&&p.id==='outline')break;
                }
                el=el.parentElement;
            }
            if(!el||el===document.body||el.tagName!=='A')return;
            var href=el.getAttribute('href');
            if(!href||href[0]!=='#')return;
            e.preventDefault();
            e.stopImmediatePropagation();
            var tgt=document.getElementById(href.slice(1));
            if(!tgt)return;
            var pg=tgt;
            while(pg&&pg!==document.body){
                if(pg.getAttribute&&(pg.getAttribute('data-page-no')||pg.classList.contains('pf')))break;
                pg=pg.parentElement;
            }
            var dest=(pg&&pg!==document.body)?pg:tgt;
            window.scrollTo(0,dest.getBoundingClientRect().top+window.pageYOffset);
        },true);
        var scale=1,dragging=false,lx=0,ly=0;
        var sidebar=document.getElementById('sidebar');
        var GRAB='grab';
        var DRAG='grabbing';
        function updateCursor(){
            pc.style.cursor=scale>1.01?(dragging?DRAG:GRAB):'default';
        }
        var zc=document.createElement('div');
        zc.id='pdf-zoom-inner';
        var pages=Array.from(pc.querySelectorAll('.pf,[data-page-no]'));
        if(pages.length>0){
            pages.forEach(function(p){zc.appendChild(p);});
        } else {
            Array.from(pc.children).forEach(function(c){
                if(c.id!=='sidebar'&&c.id!=='outline')zc.appendChild(c);
            });
        }
        pc.insertBefore(zc,pc.firstChild);
        function zoomAt(ns,cx,cy){
            var f=ns/scale;
            var sx=window.pageXOffset,sy=window.pageYOffset;
            scale=ns;
            zc.style.zoom=scale;
            if(sidebar)sidebar.style.zoom='1';
            window.scrollTo(Math.max(0,(sx+cx)*f-cx),Math.max(0,(sy+cy)*f-cy));
            updateCursor();
        }
        window.addEventListener('wheel',function(e){
            if(!e.altKey)return;
            e.preventDefault();
            e.stopImmediatePropagation();
            var factor=e.deltaY<0?1.12:1/1.12;
            var ns=Math.min(Math.max(scale*factor,0.5),5);
            if(ns<1.05)ns=1;
            zoomAt(ns,e.clientX,e.clientY);
        },{passive:false,capture:true});
        var mv=document.querySelector('meta[name="viewport"]');
        if(!mv){mv=document.createElement('meta');mv.name='viewport';document.head.appendChild(mv);}
        mv.content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no';
        pc.addEventListener('mousedown',function(e){
            if(e.button!==0||scale<=1.01)return;
            dragging=true;lx=e.clientX;ly=e.clientY;
            pc.style.cursor=DRAG;
            e.preventDefault();
        });
        window.addEventListener('mousemove',function(e){
            if(!dragging)return;
            window.scrollBy(lx-e.clientX,ly-e.clientY);
            lx=e.clientX;ly=e.clientY;
        });
        window.addEventListener('mouseup',function(){
            if(dragging){dragging=false;updateCursor();}
        });
        updateCursor();
    }
    if(document.readyState==='loading')
        document.addEventListener('DOMContentLoaded',init);
    else init();
})();
</script>
