/* Bloc unique : visualiseur + catégories soudés dans un même cadre */

// Catégories : libellé affiché -> motif(s) cherché(s) dans l'URL
var categories = [
    { label: "TOUT",          match: null },
    { label: "COMPLOTISTE",    match: ["conspiracy"] },
    { label: "Garfield",        match: ["garfield"] },
    { label: "ÉSOTÉRIQUE",        match: ["mystique, game"] },
    { label: "PUBLICITAIRE",             match: ["pub"] },
    { label: "SCIENTIFIQUE",         match: ["science"] },
    { label: "Tintin",          match: ["tintin"] },
    { label: "AMERICANA", match: ["vintage%20erotica"] },
    { label: "Magazines",       match: ["page%20magazine", "x%20-%20magazine", "porn"] },
];

var currentCategory = 0;   // index dans categories
var filtered = [];         // indices d'images de la catégorie courante
var shuffledIndices = [];
var currentIndex = 0;

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

// Construit la liste des images correspondant à la catégorie courante
function applyCategory() {
    var cat = categories[currentCategory];
    filtered = [];
    for (let i = 0; i < images.length; i++) {
        if (!cat.match || cat.match.some(m => images[i].includes(m))) {
            filtered.push(i);
        }
    }
}

// Initialise le shuffle (sur la catégorie filtrée)
function initShuffle() {
    applyCategory();
    shuffledIndices = filtered.slice();
    shuffledIndices = shuffle(shuffledIndices);
    currentIndex = 0;
}

// Affiche l'image courante
    function showImage() {
    if (shuffledIndices.length === 0) return;
    var img = document.getElementById("gallery");
    var loader = document.getElementById("lb-loader");
    document.getElementById("lb-error").classList.remove("visible"); // efface une erreur précédente
    img.style.visibility = "hidden";   // l'image en cache ne reste pas
    loader.classList.add("visible");   // cœurs de chargement
    img.src = images[shuffledIndices[currentIndex]];
}

// Extrait un nom de fichier lisible depuis l'URL GitHub
function imageName(url) {
    var path = url.split("?")[0];              // enlève ?raw=true
    var file = path.split("/").pop();          // dernier segment
    try { file = decodeURIComponent(file); } catch (e) {}
    return file;
}

// Quand l'image est chargée : on retire le loader et on l'affiche
function setupLoader() {
    var img = document.getElementById("gallery");
    var loader = document.getElementById("lb-loader");
    img.onload = function() {
        loader.classList.remove("visible");
        img.style.visibility = "visible";
    };
    img.onerror = function() {
        loader.classList.remove("visible");
        img.style.visibility = "hidden";   // pas d'icône cassée
        document.getElementById("lb-error-name").textContent =
            imageName(images[shuffledIndices[currentIndex]]);
        document.getElementById("lb-error").classList.add("visible");
    };
}

// Change de catégorie
function selectCategory(i) {
    currentCategory = i;
    initShuffle();
    showImage();
    document.querySelectorAll(".categories button").forEach((b, idx) => {
        b.classList.toggle("active", idx === i);
    });
}

// Génère les boutons de catégories
function buildCategories() {
    var list = document.getElementById("catList");
    categories.forEach((cat, i) => {
        var b = document.createElement("button");
        b.textContent = cat.label;
        if (i === currentCategory) b.classList.add("active");
        b.onclick = () => selectCategory(i);
        list.appendChild(b);
    });
}

// Image suivante (shuffle)
function nextImage() {
    currentIndex++;
    if (currentIndex >= shuffledIndices.length) initShuffle(); // reshuffle après avoir tout vu
    showImage();
}

// Image précédente (séquentiel, dans l'ordre déjà affiché)
function prevImage() {
    if (currentIndex > 0) {
        currentIndex--;
        showImage();
    }
}

// Initialisation
setupLoader();
buildCategories();
initShuffle();
showImage();
