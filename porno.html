<!DOCTYPE html>
<html>
<head>
<link rel="icon" href="https://github.com/scienceetpoesie/internet/raw/refs/heads/main/assets/icons/18.ico" type="image/x-icon">
<meta charset="UTF-8">
<title>XXX</title>
<style>
body {
    background-color: #b55987;
    font-family: "Bodoni", cursive;
    color: black;
    text-align: center;
}

/* Bloc unique : visualiseur + catégories soudés dans un même cadre */
.wrapper {
    display: flex;
    width: 800px;
    max-width: 95vw;
    height: calc(100vh - 190px);   /* tient dans la fenêtre à 100%, pas de scroll */
    margin: 30px auto 0;
    background: #c0c0c0;
    border: 4px solid #9c7488;   /* un seul cadre pour les deux */
    box-sizing: border-box;
}

.visualiser {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    border-right: 2px solid #a0a0a0;   /* séparation interne entre les deux blocs */
}

h1 {
    font-size: 40px;
}

.buttons {
    height: 70px;                  /* bande réservée sous l'image */
    display: flex;
    align-items: center;           /* boutons centrés verticalement dans la bande */
    justify-content: center;
    gap: 12px;
}

button {
    background: #c0c0c0;
    border: 2px outset white;
    padding: 5px 15px;
    font-family: "Times New Roman";
    cursor: pointer;
}

button:active {
    border: 2px inset black;
}

.footer {
    margin-top: 20px;
    font-size: 19px;
    font-family:"time new roman";
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 40px;
    flex-wrap: wrap;
}

.footer .corpo {
    font-size: 13px;
    font-style: italic;
    color: #3a0a25;
    max-width: 380px;
    text-align: left;
    line-height: 1.4;
}
    .star {
    position: fixed;
    top: 5px;
    font-size: 24px;
    color: yellow;
    font-family: "Garamond";
    z-index: 1000;
}

.left {
    left: 10px;
}

.right {
    right: 10px;
}
.image-frame {
    width: 100%;
    flex: 1;                       /* prend toute la hauteur libre du visualiseur */
    min-height: 0;
    background-color: #c0c0c0; /* même gris que le container */
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

#lb-loader {
    display: none;
    position: absolute;
    inset: 0;
    align-items: center;
    justify-content: center;
    background: #c0c0c0; /* recouvre l'image précédente */
    z-index: 5;
}

#lb-loader.visible { display: flex; }

@keyframes spin-hearts { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

#lb-loader svg { animation: spin-hearts 2.5s linear infinite; transform-origin: 50px 50px; }

#lb-error {
    display: none;
    position: absolute;
    inset: 0;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 20px;
    background: #c0c0c0;
    z-index: 6;
}

#lb-error.visible { display: flex; }

#lb-error .err-title { font-size: 20px; color: #d6002e; }

#lb-error .err-name {
    font-family: "Courier New", monospace;
    font-size: 16px;
    color: black;
    word-break: break-all;
    max-width: 90%;
}

.image-frame img {
    max-width: 97%;
    max-height: 97%;
    object-fit: contain;
    border: 3px solid #a0a0a0; /* liseré gris autour de l’image */
}

/* Menu Catégories : second bloc soudé, même hauteur automatiquement (flex) */
.categories {
    width: 180px;
    flex: none;
    background: #c0c0c0;
    text-align: center;
    display: flex;
    flex-direction: column;
}

.categories h2 {
    margin: 0;
    padding: 6px 4px;
    font-size: 22px;
    font-family: "Bodoni", "Times New Roman", serif;
    background: #c0c0c0;
    color: black;
    border-bottom: 2px solid #a0a0a0;
}

.categories .cat-list {
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
    overflow-y: auto;
    justify-content: flex-start;   /* collé en haut, espace libre en bas pour en ajouter */
}

.categories button {
    width: 100%;
    text-align: center;
}

.categories button.active {
    border: 2px inset black;
    background: #b0b0b0;
    font-weight: bold;
}
</style>
</head>
<body>

<div class="star left">★</div>
<div class="star right">★</div>

<div class="wrapper">
<div class="visualiser">
<div class="image-frame">
    <img id="gallery">
    <div id="lb-error">
        <div class="err-title">⚠ Image introuvable</div>
        <div class="err-name" id="lb-error-name"></div>
    </div>
    <div id="lb-loader">
        <svg width="100" height="100" viewBox="0 0 100 100">
            <text x="50" y="14" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#d6002e" transform="rotate(0,50,14)">❤</text>
            <text x="76" y="24" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#d6002e" transform="rotate(45,76,24)">❤</text>
            <text x="86" y="50" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#d6002e" transform="rotate(90,86,50)">❤</text>
            <text x="76" y="76" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#d6002e" transform="rotate(135,76,76)">❤</text>
            <text x="50" y="86" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#d6002e" transform="rotate(180,50,86)">❤</text>
            <text x="24" y="76" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#d6002e" transform="rotate(225,24,76)">❤</text>
            <text x="14" y="50" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#d6002e" transform="rotate(270,14,50)">❤</text>
            <text x="24" y="24" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#d6002e" transform="rotate(315,24,24)">❤</text>
        </svg>
    </div>
</div>

    <div class="buttons">
        <button onclick="prevImage()">⬅ précédent</button>
        <button onclick="nextImage()">suivant ➡</button>
    </div>
</div><!-- .visualiser -->

<div class="categories">
    <h2>Catégories</h2>
    <div class="cat-list" id="catList"></div>
</div>
</div><!-- .wrapper -->

<div class="footer">
    <p>S&P 🄯 - 2025 </p>
    <p class="corpo">Tout personnages sur ce site sont fictifs et âgés de plus de 18 ans. © S&P</p>
</div>

<script>
/* ============================================================================
   Cette page ne contient PLUS aucun nom d'image.
   Au chargement, elle lit le catalogue « liste.json » publié par l'appli
   GalerieManager, et reconstruit toute seule la galerie + les catégories.
   --> pour ajouter/retirer des images : il suffit de republier depuis l'appli.
   ========================================================================== */

// --- Seule configuration : OÙ se trouve le catalogue (pas de noms d'images) ---
var REPO      = "scienceetpoesie/internet";
var BRANCH    = "main";
var BASE_PATH = "galerie/porno";

// Deux sources pour liste.json : GitHub "raw" (toujours frais) puis, en secours,
// le CDN jsDelivr (mis en cache mondialement). On essaie raw d'abord.
var LISTE_RAW = "https://raw.githubusercontent.com/" + REPO + "/" + BRANCH + "/" + BASE_PATH + "/liste.json";
var LISTE_CDN = "https://cdn.jsdelivr.net/gh/" + REPO + "@" + BRANCH + "/" + BASE_PATH + "/liste.json";

// Valeurs effectives (relues depuis liste.json s'il les fournit)
var repo = REPO, branch = BRANCH, basePath = BASE_PATH;

// Remplis dynamiquement depuis le catalogue
var images = [];          // URLs d'images finales (CDN)
var imageCats = [];       // catégorie de chaque image (même index que 'images')
var categories = [];      // { label, value } ; value === null => bouton « TOUT »

var currentCategory = 0;  // index dans categories
var filtered = [];        // indices d'images de la catégorie courante
var shuffledIndices = [];
var currentIndex = 0;

// Construit l'URL CDN d'une image à partir de son chemin relatif dans le dépôt.
// 'fichier' ressemble à "CONSPIRACY/CONSPIRACY 001.png" : on encode chaque
// segment (espaces, accents…) tout en gardant les "/".
function urlImage(fichier) {
    var chemin = (basePath + "/" + fichier).split("/").map(encodeURIComponent).join("/");
    return "https://cdn.jsdelivr.net/gh/" + repo + "@" + branch + "/" + chemin;
}

// Transforme le catalogue JSON en listes exploitables (images + catégories).
function construireDepuisCatalogue(data) {
    repo     = data.repo      || REPO;
    branch   = data.branch    || BRANCH;
    basePath = data.base_path || BASE_PATH;

    var items = Array.isArray(data.images) ? data.images : [];
    images = [];
    imageCats = [];
    var labelParCat = {};   // catégorie -> joli titre (si défini dans l'appli)

    items.forEach(function (it) {
        if (!it || !it.fichier) return;
        images.push(urlImage(it.fichier));
        imageCats.push(it.categorie || "");
        if (it.titre && !labelParCat[it.categorie]) {
            labelParCat[it.categorie] = it.titre;
        }
    });

    // Ordre des catégories : celui du catalogue si fourni, sinon déduit des images.
    var liste = (Array.isArray(data.categories) && data.categories.length)
        ? data.categories.slice()
        : imageCats.filter(function (c, i, a) { return c && a.indexOf(c) === i; });

    categories = [{ label: "TOUT", value: null }];
    liste.forEach(function (c) {
        categories.push({ label: labelParCat[c] || c, value: c });
    });
}

// Construit la liste des images correspondant à la catégorie courante
function applyCategory() {
    var cat = categories[currentCategory];
    filtered = [];
    for (var i = 0; i < images.length; i++) {
        if (!cat || cat.value === null || imageCats[i] === cat.value) {
            filtered.push(i);
        }
    }
}

// Initialise la file de lecture (ordre défini dans l'appli, plus de hasard)
function initShuffle() {
    applyCategory();
    shuffledIndices = filtered.slice();   // ordre du catalogue, tel que rangé dans l'appli
    currentIndex = 0;
}

// Cache de préchargement : on garde les objets Image déjà demandés.
var preloadCache = {};
function preload(url) {
    if (!url || preloadCache[url]) return;
    var im = new Image();
    im.src = url;                 // déclenche le téléchargement en arrière-plan
    preloadCache[url] = im;
}

// Précharge les prochaines images de la file (et la précédente).
function preloadAround() {
    for (var k = 1; k <= 3; k++) {
        if (currentIndex + k < shuffledIndices.length) {
            preload(images[shuffledIndices[currentIndex + k]]);
        }
    }
    if (currentIndex - 1 >= 0) {
        preload(images[shuffledIndices[currentIndex - 1]]);
    }
}

// Affiche l'image courante
function showImage() {
    if (shuffledIndices.length === 0) return;
    var img = document.getElementById("gallery");
    var loader = document.getElementById("lb-loader");
    document.getElementById("lb-error").classList.remove("visible"); // efface une erreur précédente
    img.style.visibility = "hidden";   // l'image en cache ne reste pas
    loader.classList.add("visible");   // cœurs de chargement
    img.src = images[shuffledIndices[currentIndex]];  // si déjà préchargée → instantané
    preloadAround();                   // prépare les images voisines
}

// Extrait un nom de fichier lisible depuis l'URL
function imageName(url) {
    var path = (url || "").split("?")[0];      // enlève une éventuelle query
    var file = path.split("/").pop();          // dernier segment
    try { file = decodeURIComponent(file); } catch (e) {}
    return file;
}

// Affiche un message dans le cadre (catalogue vide / erreur de chargement)
function messageCadre(titre, detail) {
    document.getElementById("lb-loader").classList.remove("visible");
    document.getElementById("gallery").style.visibility = "hidden";
    document.querySelector("#lb-error .err-title").textContent = titre;
    document.getElementById("lb-error-name").textContent = detail || "";
    document.getElementById("lb-error").classList.add("visible");
}

// Quand l'image est chargée : on retire le loader et on l'affiche
function setupLoader() {
    var img = document.getElementById("gallery");
    var loader = document.getElementById("lb-loader");
    img.onload = function () {
        loader.classList.remove("visible");
        img.style.visibility = "visible";
    };
    img.onerror = function () {
        loader.classList.remove("visible");
        img.style.visibility = "hidden";   // pas d'icône cassée
        document.querySelector("#lb-error .err-title").textContent = "⚠ Image introuvable";
        document.getElementById("lb-error-name").textContent =
            imageName(images[shuffledIndices[currentIndex]]);
        document.getElementById("lb-error").classList.add("visible");
    };
}

// Change de catégorie
function selectCategory(i) {
    currentCategory = i;
    initShuffle();
    showImage();
    document.querySelectorAll(".categories button").forEach(function (b, idx) {
        b.classList.toggle("active", idx === i);
    });
}

// Génère les boutons de catégories
function buildCategories() {
    var list = document.getElementById("catList");
    list.innerHTML = "";
    categories.forEach(function (cat, i) {
        var b = document.createElement("button");
        b.textContent = cat.label;
        if (i === currentCategory) b.classList.add("active");
        b.onclick = function () { selectCategory(i); };
        list.appendChild(b);
    });
}

// Image suivante (mélange)
function nextImage() {
    if (shuffledIndices.length === 0) return;
    currentIndex++;
    if (currentIndex >= shuffledIndices.length) currentIndex = 0; // boucle dans l'ordre
    showImage();
}

// Image précédente (séquentiel, dans l'ordre déjà affiché)
function prevImage() {
    if (currentIndex > 0) {
        currentIndex--;
        showImage();
    }
}

// Récupère le catalogue puis lance la galerie.
function chargerCatalogue() {
    document.getElementById("lb-loader").classList.add("visible");
    fetch(LISTE_RAW, { cache: "no-store" })
        .then(function (r) { if (!r.ok) throw new Error("raw"); return r.json(); })
        .catch(function () { return fetch(LISTE_CDN).then(function (r) {
            if (!r.ok) throw new Error("cdn"); return r.json();
        }); })
        .then(function (data) {
            construireDepuisCatalogue(data);
            currentCategory = 0;
            buildCategories();
            initShuffle();
            if (images.length > 0) {
                showImage();
            } else {
                messageCadre("Catalogue vide",
                    "Aucune image dans liste.json. Publie ta bibliothèque depuis l'appli.");
            }
        })
        .catch(function () {
            messageCadre("Catalogue indisponible",
                "Impossible de lire liste.json. Vérifie qu'il a bien été publié sur GitHub.");
        });
}

// Initialisation
setupLoader();
chargerCatalogue();
</script>

</body>
</html>
