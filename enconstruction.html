<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>xxxxxxxxxx</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background-color: #0b3d2e; /* vert forêt foncé */
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Georgia", serif;
    }
.retour-menu {
  position: fixed;
  top: 15px;
  left: 20px;
  font-family: "Times New Roman", serif;
  font-size: 18px;
  color: #d8d3c4; /* crème grisâtre semi-clair */
  text-decoration: underline;
  transition: color 0.3s ease;
  z-index: 1000000;
}

.retour-menu:hover {
  color: #f2efe6; /* plus clair au hover */
}
    .cadre {
      background-color: #f5f0e6; /* crème */
      padding: 20px;
      border: 3px solid #d6c7a1;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
      max-width: 80%;
      max-height: 80%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .cadre img {
      max-width: 100%;
      max-height: 100%;
      display: block;
    }
    .echo {
  position: fixed;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: rgba(0, 255, 200, 0.8);
  pointer-events: none;
  transform: translate(-50%, -50%);
  animation: fade 1.2s linear forwards;
  z-index: 999999; /* toujours au-dessus */
}

@keyframes fade {
  0% { opacity: 1; transform: scale(1) translate(-50%, -50%); }
  100% { opacity: 0; transform: scale(3) translate(-50%, -50%); }
}
  </style>
</head>
<body>
<a href="index.html" class="retour-menu">Revenir au menu principal</a>
  <div class="cadre">

  </div>

</body>
</html>
